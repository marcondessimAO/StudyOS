<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Fim da sessão</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700;800&amp;family=Unbounded:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0F14}
a{color:#C4B5FD}a:hover{color:#DDD6FE}
textarea::placeholder{color:#7D8396}
.bar{transform-origin:bottom;transition:transform .12s,background .15s,border-color .15s}
.bar:hover{transform:scaleY(1.06)}
.popA{animation:popA .45s cubic-bezier(.2,1.8,.4,1)}
.popB{animation:popB .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes popA{0%{transform:scaleY(.6)}60%{transform:scaleY(1.18)}100%{transform:scaleY(1)}}
@keyframes popB{0%{transform:scaleY(.6)}60%{transform:scaleY(1.18)}100%{transform:scaleY(1)}}
.txA{display:inline-block;animation:txA .4s cubic-bezier(.2,1.6,.4,1)}
.txB{display:inline-block;animation:txB .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes txA{0%{transform:translateY(10px) scale(.8);opacity:0}100%{transform:none;opacity:1}}
@keyframes txB{0%{transform:translateY(10px) scale(.8);opacity:0}100%{transform:none;opacity:1}}
.chip{transition:transform .1s,background .15s,color .15s}
.chip:hover{transform:translateY(-2px)}
.chip:active{transform:scale(.95)}
.cta{transition:transform .12s,box-shadow .12s}
.cta:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #A3E635!important}
.cta:active{transform:translate(4px,4px);box-shadow:0 0 0 #A3E635!important}
.glow{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{filter:brightness(1.25)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 20px 24px; background-color: #0E0F14; background-image: radial-gradient(#23263A 1px, transparent 1px); background-size: 22px 22px; color: #F3F4F8; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A3E635; font-weight: 700; letter-spacing: 0.06em">■ SESSÃO ENCERRADA</span>
<h1 style="margin: 0; font-family: Unbounded, sans-serif; font-size: 40px; font-weight: 800; letter-spacing: -0.03em; line-height: 1">1h02<span style="color: #A1A7B8; font-size: 20px; font-weight: 500"> de foco</span></h1>
<span style="font-size: 14px; color: #A1A7B8">Backend · Índices compostos no PostgreSQL</span>
</div>

<fieldset style="margin: 0; padding: 16px; border: 1px solid #2A2E3D; background: #171922">
<legend style="padding: 0 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #A1A7B8">APROVEITAMENTO</legend>
<div style="display: flex; align-items: flex-end; gap: 8px; height: 96px">
<sc-for list="{{ratings}}" as="r" hint-placeholder-count="5">
<button type="button" class="{{r.cls}}" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" aria-label="{{r.aria}}" style="flex: 1; height: {{r.h}}; border: 2px solid {{r.border}}; background: {{r.bg}}; cursor: pointer; padding: 0; display: flex; align-items: flex-start; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 800; color: {{r.color}}"><span style="padding-top: 6px">{{r.n}}</span></button>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px">
<span class="{{tx}}" aria-live="polite" style="font-family: Unbounded, sans-serif; font-size: 20px; font-weight: 700; color: {{labelColor}}">{{label}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A7B8">multiplicador ×{{mult}}</span>
</div>
</fieldset>

<fieldset style="margin: 0; padding: 0; border: 0">
<legend style="padding: 0; margin-bottom: 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #A1A7B8">TIPO</legend>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="4">
<button type="button" class="chip" onClick="{{k.pick}}" aria-pressed="{{k.pressed}}" style="height: 44px; border: 1px solid {{k.border}}; background: {{k.bg}}; color: {{k.color}}; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 800; cursor: pointer; padding: 0">{{k.label}}</button>
</sc-for>
</div>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 10px">
<label for="resumo" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #A1A7B8">O QUE FICOU? (1 LINHA)</label>
<div style="display: flex; gap: 10px; padding: 12px 14px; background: #0B0C10; border: 1px solid #3A3F52">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; color: #A3E635">&gt;</span>
<textarea id="resumo" rows="2" placeholder="índice composto só ajuda se a consulta usar a 1ª coluna" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #F3F4F8; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.45; resize: none; padding: 0"></textarea>
</div>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center; font-family: 'JetBrains Mono', monospace">
<span style="font-size: 12px; color: #A1A7B8">62 × {{mult}} + 20 bônus</span>
<span class="{{tx}}" style="font-size: 24px; font-weight: 800; color: #A3E635; font-variant-numeric: tabular-nums">+{{xp}} XP</span>
</div>
<sc-if value="{{hint}}" hint-placeholder-val="{{ false }}">
<span class="{{tx}}" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #FDE047">{{hint}}</span>
</sc-if>
<a href="Recompensa.dc.html" class="cta glow" style="height: 60px; background: #7C3AED; color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 800; letter-spacing: 0.04em; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 4px 4px 0 #A3E635">SALVAR E COLETAR XP</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { rating: 4, kind: 'pratica', xpShown: 94, flip: 0 };
  }
  componentWillUnmount() { clearInterval(this.iv); }
  setRating(r) {
    const mult = [0.6, 0.8, 1.0, 1.2, 1.4];
    const target = Math.round(62 * mult[r - 1]) + 20;
    this.setState({ rating: r, flip: this.state.flip + 1 });
    clearInterval(this.iv);
    this.iv = setInterval(() => {
      const cur = this.state.xpShown;
      if (cur === target) { clearInterval(this.iv); return; }
      this.setState({ xpShown: cur + (target > cur ? 1 : -1) });
    }, 18);
  }
  renderVals() {
    const { rating, kind, xpShown, flip } = this.state;
    const labels = ['Ruim', 'Fraco', 'Ok', 'Bom', 'Excelente'];
    const mult = [0.6, 0.8, 1.0, 1.2, 1.4];
    const heights = ['36px', '50px', '64px', '80px', '96px'];
    const ratings = labels.map((label, i) => {
      const on = i < rating;
      const sel = i === rating - 1;
      return {
        n: i + 1,
        h: heights[i],
        aria: (i + 1) + ' de 5, ' + label,
        pressed: sel ? 'true' : 'false',
        bg: on ? (sel ? '#A78BFA' : '#7C3AED') : '#1F2230',
        border: sel ? '#F3F4F8' : on ? '#7C3AED' : '#2A2E3D',
        color: on ? (sel ? '#0E0F14' : '#FFFFFF') : '#7D8396',
        cls: sel ? 'bar ' + (flip % 2 ? 'popA' : 'popB') : 'bar',
        pick: () => this.setRating(i + 1)
      };
    });
    const kinds = [['leitura', 'LEITURA'], ['pratica', 'PRÁTICA'], ['revisao', 'REVISÃO'], ['projeto', 'PROJETO']].map(([id, label]) => {
      const on = kind === id;
      return {
        label,
        pressed: on ? 'true' : 'false',
        bg: on ? '#F3F4F8' : '#171922',
        color: on ? '#0E0F14' : '#F3F4F8',
        border: on ? '#F3F4F8' : '#3A3F52',
        pick: () => this.setState({ kind: id })
      };
    });
    const m = mult[rating - 1];
    const hints = ['', '', '', 'nota 5 aqui desbloquearia FOCO TOTAL', '★ conta para a conquista FOCO TOTAL'];
    const labelColors = ['#FDBA74', '#FDBA74', '#E5E7EB', '#A78BFA', '#A3E635'];
    return {
      ratings, kinds,
      label: labels[rating - 1] + (rating === 5 ? '!' : ''),
      labelColor: labelColors[rating - 1],
      tx: flip % 2 ? 'txA' : 'txB',
      hint: hints[rating - 1],
      mult: m.toFixed(1),
      xp: xpShown
    };
  }
}
</script>
</body>
</html>
