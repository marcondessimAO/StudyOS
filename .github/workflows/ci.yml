name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      APP_TZ: America/Sao_Paulo
      # Só para o Prisma gerar o cliente; nenhuma etapa do CI conecta no banco.
      DATABASE_URL: postgresql://studyos:studyos@localhost:5432/studyos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run check
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: docker build (sem push)
        run: docker build -t studyos:ci .
