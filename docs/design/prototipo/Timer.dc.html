<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sessão em andamento</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700;800&amp;family=Unbounded:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0F14}
a{color:#C4B5FD}a:hover{color:#DDD6FE}
.blk{display:block;transition:background .2s}
.blk.pop{animation:pop .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes pop{0%{transform:scale(.3);filter:brightness(2.2)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.blink{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.float{position:absolute;right:16px;top:-6px;animation:float 1.1s ease-out forwards;pointer-events:none}
@keyframes float{0%{opacity:0;transform:translateY(10px) scale(.8)}20%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-38px) scale(1)}}
.tick{animation:tick .25s ease}
@keyframes tick{50%{transform:translateY(-3px)}}
.btn{transition:transform .1s,box-shadow .1s,background .15s,color .15s}
.btn:hover{transform:translate(-2px,-2px)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 transparent!important}
.ghost:hover{background:#F3F4F8!important;color:#0E0F14!important}
.done{animation:done .8s cubic-bezier(.2,1.6,.4,1) both}
@keyframes done{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.fall{position:absolute;top:-20px;animation:fall 2.2s cubic-bezier(.25,.6,.5,1) forwards}
@keyframes fall{to{transform:translateY(900px) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 20px 20px 24px; background-color: #0E0F14; background-image: radial-gradient(#23263A 1px, transparent 1px); background-size: 22px 22px; color: #F3F4F8; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; justify-content: space-between; font-family: 'JetBrains Mono', monospace">
<a href="Main.dc.html" aria-label="Voltar ao painel" class="btn ghost" style="width: 44px; height: 44px; box-sizing: border-box; border: 1px solid #3A3F52; background: #171922; color: #F3F4F8; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
<span style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: {{statusColor}}"><span class="{{dotClass}}" style="width: 8px; height: 8px; background: {{statusColor}}"></span>{{status}}</span>
<span style="font-size: 13px; font-weight: 800; color: #1A0E05; background: #FB923C; padding: 6px 10px">08 DIAS</span>
</div>

<div style="padding: 14px 16px; background: #171922; border: 1px solid #2A2E3D; border-left: 4px solid #8B5CF6; display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: #C4B5FD; letter-spacing: 0.06em">BACKEND · PRÁTICA</span>
<span style="font-size: 17px; font-weight: 600">Índices compostos no PostgreSQL</span>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0 0">
<span class="{{clockClass}}" style="font-family: 'JetBrains Mono', monospace; font-size: 84px; font-weight: 800; letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums">{{clock}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A7B8; letter-spacing: 0.08em">{{caption}}</span>
</div>

<div style="position: relative; padding: 14px; background: #0B0C10; border: 1px solid #2A2E3D; display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{floatOn}}" hint-placeholder-val="{{ false }}">
<span class="float" style="font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 800; color: #A3E635">+1 XP</span>
</sc-if>
<div style="display: grid; grid-template-columns: repeat({{cols}}, minmax(0, 1fr)); gap: 4px" role="img" aria-label="{{gridAria}}">
<sc-for list="{{blocks}}" as="b" hint-placeholder-count="25"><span class="{{b.cls}}" style="height: {{b.h}}; background: {{b.c}}"></span></sc-for>
</div>
<div style="display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A1A7B8">
<span>1 bloco = 1 min</span><span style="color: #A3E635; font-weight: 700">+{{xpEstimate}} XP até agora</span>
</div>
</div>

<div style="display: flex; border: 1px solid #3A3F52">
<button type="button" class="btn" onClick="{{setPomo}}" aria-pressed="{{pomoPressed}}" style="flex: 1; height: 44px; border: 0; background: {{pomoBg}}; color: {{pomoColor}}; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; cursor: pointer">POMODORO 25/5</button>
<button type="button" class="btn" onClick="{{setFree}}" aria-pressed="{{freePressed}}" style="flex: 1; height: 44px; border: 0; background: {{freeBg}}; color: {{freeColor}}; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; cursor: pointer">LIVRE</button>
<button type="button" class="btn" onClick="{{toggleFast}}" aria-pressed="{{fastPressed}}" aria-label="Acelerar o tempo para demonstração" style="width: 64px; height: 44px; border: 0; border-left: 1px solid #3A3F52; background: {{fastBg}}; color: {{fastColor}}; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 800; cursor: pointer">×60</button>
</div>

<div style="margin-top: auto; display: flex; gap: 12px">
<button type="button" class="btn ghost" onClick="{{toggle}}" style="flex: 1; height: 58px; border: 2px solid #F3F4F8; background: transparent; color: #F3F4F8; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 800; cursor: pointer">{{toggleLabel}}</button>
<a href="Avaliar.dc.html" class="btn" style="flex: 1.3; height: 58px; box-sizing: border-box; background: #7C3AED; color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 800; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 4px 4px 0 #A3E635">FINALIZAR ✓</a>
</div>

<sc-if value="{{complete}}" hint-placeholder-val="{{ false }}">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; z-index: 4">
<sc-for list="{{confetti}}" as="p" hint-placeholder-count="30">
<div class="fall" style="left: {{p.x}}; width: {{p.s}}; height: {{p.s}}; background: {{p.c}}; animation-delay: {{p.d}}"></div>
</sc-for>
</div>
<div role="status" style="position: absolute; inset: 0; z-index: 3; background: rgba(14,15,20,0.88); display: flex; align-items: center; justify-content: center; padding: 24px">
<div class="done" style="width: 100%; padding: 26px 22px; background: #171922; border: 2px solid #A3E635; box-shadow: 6px 6px 0 #7C3AED; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 800; letter-spacing: 0.1em; color: #0E0F14; background: #A3E635; padding: 4px 10px">BLOCO 1 COMPLETO</span>
<span style="font-family: Unbounded, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1">25 min<br>no foco.</span>
<span style="font-size: 14px; color: #A1A7B8">Levanta, bebe água. Pausa de 5 min e depois o próximo bloco.</span>
<div style="display: flex; gap: 10px; width: 100%; margin-top: 6px">
<button type="button" class="btn ghost" onClick="{{nextBlock}}" style="flex: 1; height: 52px; border: 2px solid #F3F4F8; background: transparent; color: #F3F4F8; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 800; cursor: pointer; pointer-events: auto">PAUSA 5 MIN</button>
<a href="Avaliar.dc.html" class="btn" style="flex: 1; height: 52px; background: #7C3AED; color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 800; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 4px 4px 0 #A3E635; pointer-events: auto">ENCERRAR</a>
</div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { elapsed: 1421, running: true, mode: 'pomo', fast: false, floatKey: 0, floatOn: false, complete: false, shown: false };
  }
  componentDidMount() {
    this.tick = setInterval(() => {
      const s = this.state;
      if (!s.running || s.complete) return;
      const step = s.fast ? 60 : 1;
      const next = s.elapsed + step;
      const crossed = Math.floor(next / 60) > Math.floor(s.elapsed / 60);
      const patch = { elapsed: next };
      if (crossed) {
        patch.floatOn = false;
        clearTimeout(this.floatT);
        clearTimeout(this.floatOffT);
        this.floatT = setTimeout(() => this.setState({ floatOn: true }), 30);
        this.floatOffT = setTimeout(() => this.setState({ floatOn: false }), 900);
      }
      if (s.mode === 'pomo' && next >= 1500 && !s.shown) { patch.complete = true; patch.shown = true; patch.elapsed = 1500; }
      this.setState(patch);
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.tick); clearTimeout(this.floatT); }
  renderVals() {
    const { elapsed, running, mode, fast, floatOn, complete } = this.state;
    const pomo = mode === 'pomo';
    const total = 1500;
    const shown = pomo ? Math.max(total - elapsed, 0) : elapsed;
    const pad = (n) => String(n).padStart(2, '0');
    const h = Math.floor(shown / 3600);
    const clock = (h > 0 ? h + ':' : '') + pad(Math.floor((shown % 3600) / 60)) + ':' + pad(shown % 60);
    const mins = Math.floor(elapsed / 60);
    const n = pomo ? 25 : 60;
    const filled = pomo ? Math.min(mins, 25) : mins % 60;
    const blocks = Array.from({ length: n }, (_, i) => ({
      h: pomo ? '34px' : '22px',
      cls: i === filled - 1 ? 'blk pop' : i === filled && running ? 'blk blink' : 'blk',
      c: i < filled ? (i === filled - 1 ? '#A78BFA' : '#7C3AED') : i === filled && running ? '#A3E635' : '#1F2230'
    }));
    const colors = ['#A78BFA', '#FB923C', '#A3E635', '#60A5FA', '#FDE047'];
    const confetti = Array.from({ length: 30 }, (_, i) => ({ x: ((i * 53) % 380) + 'px', s: (i % 2 ? 6 : 10) + 'px', c: colors[i % 5], d: ((i * 61) % 600) + 'ms' }));
    return {
      clock,
      clockClass: running && !complete ? (elapsed % 2 ? 'tick' : '') : '',
      caption: !running ? 'PAUSADO' : pomo ? 'RESTANTES NESTE BLOCO' : 'TEMPO ESTUDADO',
      status: running ? 'REC' : 'PAUSA',
      statusColor: running ? '#A3E635' : '#A1A7B8',
      dotClass: running ? 'blink' : '',
      cols: pomo ? 5 : 10,
      blocks,
      floatOn,
      complete,
      confetti,
      gridAria: filled + ' de ' + n + ' minutos',
      toggleLabel: running ? 'PAUSAR' : 'CONTINUAR',
      toggle: () => this.setState({ running: !running }),
      setFree: () => this.setState({ mode: 'free' }),
      setPomo: () => this.setState({ mode: 'pomo' }),
      toggleFast: () => this.setState({ fast: !fast }),
      nextBlock: () => this.setState({ complete: false, mode: 'free' }),
      pomoPressed: pomo ? 'true' : 'false',
      freePressed: pomo ? 'false' : 'true',
      fastPressed: fast ? 'true' : 'false',
      pomoBg: pomo ? '#F3F4F8' : 'transparent',
      pomoColor: pomo ? '#0E0F14' : '#A1A7B8',
      freeBg: pomo ? 'transparent' : '#F3F4F8',
      freeColor: pomo ? '#A1A7B8' : '#0E0F14',
      fastBg: fast ? '#A3E635' : 'transparent',
      fastColor: fast ? '#0E0F14' : '#A1A7B8',
      xpEstimate: mins
    };
  }
}
</script>
</body>
</html>
